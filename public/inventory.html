<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory | Oyera Auto Service Bay Ltd (OAS Bay)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

  <header class="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning border-opacity-25 shadow-sm">
      <div class="container">
        <a href="index.html" class="navbar-brand d-flex align-items-center gap-2">
          <img src="images/oyera-logo.jpg" alt="Oyera Auto Service Bay Ltd logo" width="32" height="32" class="d-inline-block align-text-top rounded border border-warning">
          <span class="fs-5 fw-bold text-white">Oyera <span class="text-warning">Auto Service Bay</span></span>
        </a>
        <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks" aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navLinks">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fw-semibold">
            <li class="nav-item"><a class="nav-link text-light" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="addnewcustomer.html">Add New Customer</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="addinventory.html">Add Inventory</a></li>
            <li class="nav-item"><a class="nav-link active text-warning" href="inventory.html">Inventory</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="servicerecords.html">Service History</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <br><br>

  <main class="flex-grow-1 py-4">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="h4 text-warning fw-bold mb-0">Inventory Stock</h3>
        <a href="addinventory.html" class="btn btn-warning btn-sm fw-bold">+ Add New Item</a>
      </div>

      <div class="card bg-dark text-light border-secondary shadow">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-dark table-striped table-hover align-middle mb-0 border-secondary">
              <thead class="bg-secondary bg-opacity-20 border-bottom border-warning border-opacity-25">
                <tr class="text-uppercase small fw-bold text-warning">
                  <th scope="col" class="py-3 ps-3">Item Name</th>
                  <th scope="col" class="py-3">Part No.</th>
                  <th scope="col" class="py-3">Category</th>
                  <th scope="col" class="py-3">Quantity</th>
                  <th scope="col" class="py-3">Unit Price (UGX)</th>
                  <th scope="col" class="py-3 pe-3 text-end">Supplier</th>
                </tr>
              </thead>
              <tbody id="inventoryTableBody" class="fw-medium"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/inventory.mjs"></script>
</body>
</html>
