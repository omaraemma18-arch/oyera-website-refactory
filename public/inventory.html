<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inventory — Oyera Auto Service Bay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div id="app-shell"></div>
  <div class="app-content">
    <main id="page-content">

      <div class="panel">
        <div class="panel-header">
          <h2>Inventory</h2>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <div class="search-box">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search items…">
            </div>
            <a href="/addinventory" class="btn btn-sm btn-oas d-none" id="addItemBtn">
              <i class="bi bi-plus-lg"></i> Add Item
            </a>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-oas mb-0">
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Supplier</th>
                <th>Unit Cost</th>
                <th>Quantity</th>
                <th class="d-none" id="actionsHeader">Actions</th>
              </tr>
            </thead>
            <tbody id="invTableBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state d-none">No inventory items found.</div>
      </div>

    </main>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body p-4">
        <h5 class="mb-2">Remove this item?</h5>
        <p class="text-muted small mb-4" id="deleteItemName"></p>
        <div class="d-flex gap-2 justify-content-end">
          <button class="btn btn-light border btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/inventory.js"></script>
</body>
</html>
