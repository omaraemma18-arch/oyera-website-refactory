<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register Technician — Oyera Auto Service Bay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div id="app-shell"></div>
  <div class="app-content">
    <main id="page-content">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-6">
          <div class="panel p-4">
            <h2 class="mb-1" style="font-size:1.1rem;">Register a Technician</h2>
            <p class="text-muted small mb-4">Creates a login account with the Technician role.</p>

            <div class="form-alert error" id="formAlert"></div>
            <div class="form-alert success" id="successAlert"></div>

            <form id="regForm" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="name" required>
                <div class="invalid-feedback">Please enter the technician's full name.</div>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Email</label>
                <input type="email" class="form-control" id="email" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>
              <div class="mb-4">
                <label class="form-label small fw-semibold">Temporary Password</label>
                <input type="password" class="form-control" id="password" required minlength="6">
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
              </div>
              <button type="submit" class="btn btn-oas px-4" id="submitBtn">Create Account</button>
            </form>
          </div>

          <div class="panel p-4 mt-4">
            <h2 class="mb-3" style="font-size:1.1rem;">Existing Technicians</h2>
            <div id="techList" class="small"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
