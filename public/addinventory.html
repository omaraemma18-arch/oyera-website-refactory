<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Add Inventory Item — Oyera Auto Service Bay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div id="app-shell"></div>
  <div class="app-content">
    <main id="page-content">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-6">
          <div class="panel p-4">
            <h2 class="mb-1" style="font-size:1.1rem;" id="formTitle">Add Inventory Item</h2>
            <p class="text-muted small mb-4">Unit costs are in Ugandan Shillings (UGX).</p>

            <div class="form-alert error" id="formAlert"></div>
            <div class="form-alert success" id="successAlert"></div>

            <form id="itemForm" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Item Name</label>
                <input type="text" class="form-control" id="name" required>
                <div class="invalid-feedback">Please enter the item name.</div>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Category</label>
                  <input type="text" class="form-control" id="category" placeholder="e.g. Fluids">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Supplier</label>
                  <input type="text" class="form-control" id="supplier" placeholder="Optional">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Unit Cost (UGX)</label>
                  <input type="number" class="form-control" id="unitCost" min="0" step="1" required>
                  <div class="invalid-feedback">Please enter a valid cost.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Quantity in Stock</label>
                  <input type="number" class="form-control" id="quantity" min="0" step="1" required>
                  <div class="invalid-feedback">Please enter a valid quantity.</div>
                </div>
              </div>

              <button type="submit" class="btn btn-oas px-4 mt-4" id="submitBtn">Add Item</button>
              <a href="/inventory" class="btn btn-light border px-4 mt-4">Cancel</a>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/addinventory.js"></script>
</body>
</html>
