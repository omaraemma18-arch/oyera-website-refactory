<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Oyera Auto Service Bay Ltd (OAS Bay)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="logo">
        <img src="images/oyera-logo.jpg" alt="Oyera Auto Service Bay Ltd logo" class="logo-icon-img">
        <span class="logo-text">Oyera <strong>Auto Service Bay</strong></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html#services">Services</a></li>
        <li><a href="services.html#pricing">Pricing</a></li>
        <li id="authNavSlot"></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="auth-page">
      <div class="auth-card">
        <span class="section-tag">Welcome Back</span>
        <h1>Log In</h1>
        <p class="auth-sub">Technicians, admins, and customers all sign in here.</p>

        <div class="auth-error" id="loginError"></div>

        <form id="loginForm" action="/login" method="post">
          <label>
            <span>Role</span>
            <select name="loginRole" id="loginRole" required>
              <option value="customer">Customer</option>
              <option value="technician">Technician</option>
              <option value="senior_technician">Senior Technician</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <label>
            <span>Email</span>
            <input name="loginEmail"  type="email" id="loginEmail" required placeholder="you@email.com">
          </label>
          <label>
            <span>Password</span>
            <input name="loginPassword" type="password" id="loginPassword" required placeholder="••••••••">
          </label>
          <button type="submit" class="btn btn-primary btn-full">Log In</button>
        </form>


        <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>
      </div>
    </div>
  </main>
</body>
</html>
