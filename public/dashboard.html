<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dashboard — Oyera Auto Service Bay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div id="app-shell"></div>
  <div class="app-content">
    <main id="page-content">

      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-people"></i></div>
            <div class="stat-label">Total Customers</div>
            <div class="stat-value" id="statTotal">—</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-hourglass-split"></i></div>
            <div class="stat-label">Available</div>
            <div class="stat-value" id="statAvailable">—</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-tools"></i></div>
            <div class="stat-label">In Progress</div>
            <div class="stat-value" id="statInProgress">—</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-check2-circle"></i></div>
            <div class="stat-label">Completed</div>
            <div class="stat-value" id="statCompleted">—</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Customers</h2>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <select class="form-select form-select-sm" id="statusFilter" style="width:auto;">
              <option value="">All statuses</option>
              <option value="Available">Available</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
            <div class="search-box">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search name, phone, plate…">
            </div>
            <a href="/addnewcustomer" class="btn btn-sm btn-oas d-none" id="addCustomerBtn">
              <i class="bi bi-plus-lg"></i> Add Customer
            </a>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-oas mb-0">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Vehicle</th>
                <th>Phone</th>
                <th>Issue</th>
                <th>Technician</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="customerTableBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state d-none">No customers match your search.</div>
      </div>

    </main>
  </div>
</div>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
