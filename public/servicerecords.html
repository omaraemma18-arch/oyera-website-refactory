<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Service History — Oyera Auto Service Bay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div id="app-shell"></div>
  <div class="app-content">
    <main id="page-content">

      <div class="panel">
        <div class="panel-header">
          <h2>Service History</h2>
          <div class="search-box">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search customer, plate, technician…">
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-oas mb-0">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Vehicle</th>
                <th>Technician</th>
                <th>Work Done</th>
                <th>Materials</th>
                <th>Labour</th>
                <th>Total</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recordsTableBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state d-none">No service records yet.</div>
      </div>

    </main>
  </div>
</div>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/servicerecords.js"></script>
</body>
</html>
