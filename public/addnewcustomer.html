<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Customer | Oyera Auto Service Bay Ltd (OAS Bay)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

  <header class="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
      <div class="container">
        <a href="index.html" class="navbar-brand d-flex align-items-center gap-2">
          <img src="images/oyera-logo.jpg" alt="Oyera Auto Service Bay Ltd logo" width="30" height="30" class="d-inline-block align-text-top rounded">
          <span class="fs-6">Oyera <strong class="text-warning">Auto Service Bay</strong></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks" aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navLinks">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="addnewcustomer.html">Add New Customer</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="addinventory.html">Add Inventory</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="inventory.html">Inventory</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="servicerecords.html">Service History</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <br><br><br>

  <main class="flex-grow-1">
    <section class="py-4 bg-secondary bg-opacity-10 border-bottom border-secondary">
      <div class="container" style="max-width: 750px;">
        <span class="badge bg-danger mb-2">Staff Only</span>
        <h1 class="h3 text-white fw-bold mb-1">Add New Customer Booking</h1>
        <p class="text-muted small mb-0">Register a customer vehicle into the active service dashboard.</p>
      </div>
    </section>

    <section class="py-4">
      <div class="container" style="max-width: 750px;">
        <div class="card bg-dark text-light border-secondary">
          <div class="card-body p-4">
            <form action="/addnewcustomer" method="POST" class="needs-validation" novalidate>
              
              <div class="mb-3">
                <label for="carName" class="form-label small fw-bold text-light">Car / Vehicle Name <span class="text-danger">*</span></label>
                <input name="carName" type="text" class="form-control form-control-sm bg-dark text-light border-secondary" id="carName" required placeholder="e.g. Toyota Land Cruiser">
              </div>

              <div class="mb-3">
                <label for="numberPlate" class="form-label small fw-bold text-light">Number Plate <span class="text-danger">*</span></label>
                <input name="numberPlate" type="text" class="form-control form-control-sm bg-dark text-light border-secondary" id="numberPlate" required placeholder="e.g. UBA 123A">
              </div>

              <div class="row g-2 mb-3">
                <div class="col-12 col-md-6">
                  <label for="serviceCategory" class="form-label small fw-bold text-light">Service Category</label>
                  <select name="serviceCategory" id="serviceCategory" class="form-select form-select-sm bg-dark text-light border-secondary">
                    <option value="Routine Maintenance">Routine Maintenance</option>
                    <option value="Engine Repair">Engine Repair</option>
                    <option value="Brake Service">Brake Service</option>
                    <option value="Tyre Alignment">Tyre Alignment</option>
                    <option value="Electrical Diagnostics">Electrical Diagnostics</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label for="vehicleSizeCategory" class="form-label small fw-bold text-light">Vehicle Size</label>
                  <select name="vehicleSizeCategory" id="vehicleSizeCategory" class="form-select form-select-sm bg-dark text-light border-secondary">
                    <option value="small">Small Vehicle</option>
                    <option value="commercial">Commercial</option>
                    <option value="heavy">Heavy Vehicle</option>
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label for="assignedTechnician" class="form-label small fw-bold text-light">Assigned Technician</label>
                <input name="assignedTechnician" type="text" class="form-control form-control-sm bg-dark text-light border-secondary" id="assignedTechnician" placeholder="e.g. Ronald Mwaka">
              </div>

              <div class="row g-2 mb-3">
                <div class="col-12 col-md-6">
                  <label for="serviceCost" class="form-label small fw-bold text-light">Service Cost (UGX)</label>
                  <input name="serviceCost" type="number" class="form-control form-control-sm bg-dark text-light border-secondary" id="serviceCost" min="0" value="0">
                </div>

                <div class="col-12 col-md-6">
                  <label for="labourFee" class="form-label small fw-bold text-light">Labour Fee (UGX)</label>
                  <input name="labourFee" type="number" class="form-control form-control-sm bg-dark text-light border-secondary" id="labourFee" min="0" value="0">
                </div>
              </div>

              <div class="row g-2 pt-2">
                <div class="col-6">
                  <a href="dashboard.html" class="btn btn-outline-light btn-sm w-100">Cancel</a>
                </div>
                <div class="col-6">
                  <button type="submit" class="btn btn-warning btn-sm w-100 fw-bold">Save Customer</button>
                </div>
              </div>

            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer bg-dark border-top border-secondary py-4 mt-auto">
    <div class="container text-center">
      <p class="text-muted small mb-0">&copy; 2026 Oyera Auto Service Bay Ltd (OAS Bay). All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
