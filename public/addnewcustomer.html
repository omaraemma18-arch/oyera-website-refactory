<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Add New Customer — Oyera Auto Service Bay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div id="app-shell"></div>
  <div class="app-content">
    <main id="page-content">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
          <div class="panel p-4">
            <h2 class="mb-1" style="font-size:1.1rem;">Add New Customer</h2>
            <p class="text-muted small mb-4">Log a vehicle into the service queue.</p>

            <div class="form-alert error" id="formAlert"></div>
            <div class="form-alert success" id="successAlert"></div>

            <form id="custForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Customer Name</label>
                  <input type="text" class="form-control" id="name" required>
                  <div class="invalid-feedback">Please enter the customer's name.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Phone Number</label>
                  <input type="text" class="form-control" id="phone" required>
                  <div class="invalid-feedback">Please enter a phone number.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Vehicle Plate</label>
                  <input type="text" class="form-control" id="vehiclePlate" required>
                  <div class="invalid-feedback">Please enter the vehicle's plate number.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Vehicle Type</label>
                  <select class="form-select" id="vehicleType" required>
                    <option value="" selected disabled>Choose…</option>
                    <option value="Small">Small Car</option>
                    <option value="Commercial">Commercial</option>
                    <option value="Heavy">Heavy Vehicle</option>
                  </select>
                  <div class="invalid-feedback">Please choose a vehicle type.</div>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Issue Description</label>
                  <textarea class="form-control" id="issueDescription" rows="3" required></textarea>
                  <div class="invalid-feedback">Please describe the issue.</div>
                </div>
              </div>

              <button type="submit" class="btn btn-oas px-4 mt-4" id="submitBtn">Add Customer</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/addnewcustomer.js"></script>
</body>
</html>
